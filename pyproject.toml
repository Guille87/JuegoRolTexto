[project]
name = "juego-rol-texto"
version = "0.3.0"
description = "Juego de rol por turnos en consola, escrito en Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "colorama==0.4.6",
    "pygame-ce==2.5.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5",
    "ruff>=0.6",
    "genbadge[coverage]>=1.1",
]

[project.scripts]
juego-rol-texto = "juego_rol_texto.app:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Conjunto conservador: pyflakes (F), errores de pycodestyle (E4/E7/E9), avisos
# (W) y orden de imports (I). Reglas más opinables (UP, B, SIM...) se añadirán
# en una pasada posterior (ver ROADMAP).
select = ["E4", "E7", "E9", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Los __init__.py de paquete reexportan clases a propósito (F401).
"__init__.py" = ["F401"]
# app.py reconfigura sys.stdout y conftest fija SDL_AUDIODRIVER *antes* de los
# imports a propósito (E402), y secrets.example.py es una plantilla, no un módulo.
"src/juego_rol_texto/app.py" = ["E402"]
"tests/conftest.py" = ["E402"]
"src/juego_rol_texto/config/secrets.example.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["juego_rol_texto"]
# Se excluye la capa de "pegamento": bucles de menú interactivos (ui/menus.py) y
# la orquestación de arranque (app.py). Son casi todo llamadas a input()/print()
# encadenadas; testearlas a fondo aporta poco frente a testear la lógica de
# juego. La cobertura mide así el código que de verdad conviene cubrir.
omit = [
    "*/__main__.py",
    "*/ui/menus.py",
    "*/app.py",
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
