name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: dummy
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (formato)
        run: ruff format --check .

      - name: Tests + cobertura
        run: pytest --cov=juego_rol_texto --cov-report=xml --cov-report=term-missing

  coverage-badge:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Medir cobertura
        run: pytest --cov=juego_rol_texto --cov-report=xml -q

      - name: Generar el badge
        run: genbadge coverage -i coverage.xml -o .github/badges/coverage.svg

      - name: Commitear el badge si ha cambiado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: actualiza el badge de cobertura [skip ci]"
          file_pattern: .github/badges/coverage.svg
